[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "bayesian-filters-rust"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=2.3"]
description = "Experimental native kernels for Bayesian Filters"

[tool.maturin]
module-name = "_bayesian_filters_rust"
